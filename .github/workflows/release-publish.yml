name: Release publish

# After a merge to master, publish both images as X.Y.Z, X.Y, X, and latest for amd64 and arm64,
# sign them with keyless cosign, then create the vX.Y.Z tag and GitHub Release.
# A version that is already tagged is skipped, so a merge without a bump releases nothing.
on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the release state
        id: state
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$VERSION' is not X.Y.Z"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ] || git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.state.outputs.release == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.state.outputs.release == 'true'
      - uses: sigstore/cosign-installer@v3
        if: steps.state.outputs.release == 'true'

      - name: Sign in to GHCR
        if: steps.state.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the CI image
        id: ci
        if: steps.state.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: images/ci
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ci:${{ steps.state.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/ci:${{ steps.state.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/ci:${{ steps.state.outputs.major }}
            ${{ env.IMAGE_PREFIX }}/ci:latest

      - name: Publish the runtime image
        id: runtime
        if: steps.state.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: images/runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/runtime:${{ steps.state.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/runtime:${{ steps.state.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/runtime:${{ steps.state.outputs.major }}
            ${{ env.IMAGE_PREFIX }}/runtime:latest

      - name: Sign the images
        if: steps.state.outputs.release == 'true'
        env:
          CI_DIGEST: ${{ steps.ci.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_PREFIX/ci@$CI_DIGEST"
          cosign sign --yes "$IMAGE_PREFIX/runtime@$RUNTIME_DIGEST"

      - name: Create the tag and GitHub Release
        if: steps.state.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          node scripts/release.mjs notes --version "$VERSION" > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.state.outputs.version }}
          RELEASE: ${{ steps.state.outputs.release }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            echo "Released v$VERSION: $IMAGE_PREFIX/ci and $IMAGE_PREFIX/runtime (amd64, arm64, signed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v$VERSION is already released or not prepared. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
