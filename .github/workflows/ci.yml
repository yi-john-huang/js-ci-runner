name: CI

# Gitflow: feature/* -> develop (pull request), develop -> master (release pull request).
# Every pull request lints, builds, smoke-tests, and scans both images.
# Each push to develop also publishes :develop and :sha-<commit> images, then proves the
# CI image works as a GitHub Actions job container.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the CI Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/ci/Dockerfile
      - name: Lint the runtime Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: images/runtime/Dockerfile
      - name: Lint shell scripts
        run: shellcheck tests/*.sh scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the release script
        run: node --test 'scripts/*.test.mjs'

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ci, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          load: true
          tags: local/${{ matrix.image }}:test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test
        run: bash tests/smoke-${{ matrix.image }}.sh local/${{ matrix.image }}:test

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Report high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:test
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the develop image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:develop
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

  job-container:
    # Proves the published CI image works where it is meant to run: as a job container,
    # with actions/checkout writing to the runner's UID 1001 workspace.
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/ci:sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Runs as the non-root runner user
        run: test "$(id -u)" = "1001" && test "$(id -un)" = "runner"
      - name: Test the example app
        working-directory: examples/hello-app
        run: npm test
