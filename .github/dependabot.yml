# Gitflow: dependency updates open pull requests against develop.
# The "build" prefix makes each update a patch release under Conventional Commits.
version: 2
updates:
  - package-ecosystem: docker
    directory: /images/ci
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /images/runtime
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
